# ament_python boilerplate. Without this, colcon installs console_scripts to
# install/<pkg>/bin/ instead of install/<pkg>/lib/<pkg>/, and `ros2 run` / `ros2 pkg
# executables` cannot find them: the build succeeds and the node is simply invisible.
[develop]
script_dir=$base/lib/zero_control
[install]
install_scripts=$base/lib/zero_control
